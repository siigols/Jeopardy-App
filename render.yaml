# Render deployment config (Blueprint).
#
# Secrets are declared with `sync: false`, which means Render prompts for them in
# the dashboard and never stores them in this file. Do not put real values here —
# it is committed to the repo.
services:
  - type: web
    name: jeopardy-app
    runtime: node
    plan: free
    # --include=dev is required. NODE_ENV=production (below) makes `npm ci` skip
    # devDependencies, but the build tooling — vite, typescript, the react plugin —
    # lives there, so a plain `npm ci` installs nothing the build needs and
    # `tsc -b` fails with "Cannot find module 'vite'". The flag only affects
    # installation; the running server still sees NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/boards
    envVars:
      # Pinned so Render and CI build on the same runtime. The npm scripts use
      # --env-file-if-exists, which needs Node 20.18+ / 22.9+.
      # Keep in sync with .github/workflows/ci.yml.
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # Render terminates TLS and proxies to the app, so every request arrives from
      # the proxy's address. Without this the edit-code rate limiter buckets all
      # visitors together and ten bad guesses lock out everyone.
      - key: TRUST_PROXY
        value: "1"

      # Set these in the Render dashboard.
      #   TURSO_DATABASE_URL  libsql://<db>-<org>.turso.io   (turso db show <db> --url)
      #   TURSO_AUTH_TOKEN                                   (turso db tokens create <db>)
      #   EDIT_CODE           shared secret for the board editor
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EDIT_CODE
        sync: false
